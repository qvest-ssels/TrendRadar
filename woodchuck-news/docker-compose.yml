services:
  # Static site generator
  generator:
    build:
      context: .
      dockerfile: Dockerfile
      target: generator
    container_name: woodchuck-generator
    volumes:
      - ./output:/app/output
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
    environment:
      - MCP_API_URL=http://host.docker.internal:3333
      - TZ=Europe/Berlin
    # Run once and exit, or use watch mode
    # command: python -m generator --watch --interval 3600

  # nginx web server
  nginx:
    image: nginx:alpine
    container_name: woodchuck-nginx
    ports:
      - "8080:80"
    volumes:
      - ./output:/usr/share/nginx/html:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites:/etc/nginx/conf.d:ro
    depends_on:
      - generator
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
