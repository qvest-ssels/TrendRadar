server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Cache HTML for short time (allows updates)
    location ~* \.html$ {
        expires 5m;
        add_header Cache-Control "public, must-revalidate";
    }

    # Main routes - serve index.html for directories
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Date-based news routes: /news/2025-11-29/
    location ~ ^/news/(\d{4}-\d{2}-\d{2})/$ {
        try_files $uri $uri/index.html =404;
    }

    # Article routes: /news/2025-11-29/slug-id.html
    location ~ ^/news/(\d{4}-\d{2}-\d{2})/([a-z0-9-]+)\.html$ {
        try_files $uri =404;
    }

    # Region routes: /region/europe/
    location ~ ^/region/([a-z_]+)/$ {
        try_files $uri $uri/index.html =404;
    }

    # Language routes: /language/en/
    location ~ ^/language/([a-z]{2})/$ {
        try_files $uri $uri/index.html =404;
    }

    # Static files directory
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }

    # Robots.txt
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # Error pages
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        internal;
    }
}
