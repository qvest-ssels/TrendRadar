services:
  # News Chat Web UI + API
  news-chat:
    build: .
    container_name: news-chat
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOST=http://host.docker.internal:11434
      - MCP_URL=http://host.docker.internal:3333
      - MODEL=qwen2.5:14b
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Run Ollama in Docker (comment out if running natively)
