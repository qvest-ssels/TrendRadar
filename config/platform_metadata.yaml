# - aggregator: News aggregation platform
# - social_media: Social media platform with trending topics
# - video_platform: Video sharing platform
# - forum: Discussion forum
# - q_and_a: Question and answer platform
# - online_news: Online-only news publication
# - search_engine: Search engine with trending topics
