# Platform Metadata for TrendRadar News Sources
# This file contains additional metadata for each news platform
# including homepage, Wikipedia page, country, type, and founding year.
#
# Note: This is separate from config.yaml to keep configuration clean.
# The platform_id must match the id in config.yaml

